<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>brkcoo</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="test.js"></script>
    <style>
      .garden {
        position: relative;
        width: 200px;
        height: 200px;
        border: 5px solid #cccccc;
        border-radius: 10px;
      }

      .ball {
        position: absolute;
        top: 90px;
        left: 90px;
        width: 20px;
        height: 20px;
        background: green;
        border-radius: 100%;
      }
    </style>
  </head>
  <body>
    <div class="garden">
      <div class="ball"></div>
    </div>
    Hold the device parallel to the ground. Rotate along its x and y axes to see the ball move up/down and left/right respectively.
    <pre class="output"></pre>
  </body>
</html>
